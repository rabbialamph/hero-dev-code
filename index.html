<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Gadgets BD | Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top left, #ffffff, #f3f4f6);
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 60px 40px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
      max-width: 480px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #0071e3;
      background: rgba(0, 113, 227, 0.08);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #1d1d1f;
    }

    p {
      font-size: 16px;
      color: #86868b;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .footer {
      font-size: 13px;
      color: #a1a1a6;
      font-weight: 500;
      letter-spacing: 0.2px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      padding-top: 20px;
    }

    .footer span {
      color: #1d1d1f;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">Next Generation Experience</div>
    <h1>Coming Soon</h1>
    <p>We are crafting something extraordinary for you. Stay tuned for the ultimate experience.</p>
    
    <div class="footer">
      Developed by <span>Rabbi Alam</span>
    </div>
  </div>

</body>
</html>
